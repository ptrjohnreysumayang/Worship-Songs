document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 bold; cursor: pointer; color: #14143c;\">Upload photo&hellip;<\/button>\n              <span style=\"font-size: 13px; color: #5b6390;\">{{ bgPhotoStatus }}<\/span>\n            <\/div>\n          <\/sc-if>\n          <input type=\"file\" accept=\"image/*\" ref=\"{{ bgPhotoRef }}\" onChange=\"{{ onBgPhotoFile }}\" style=\"display: none;\">\n        <\/div>\n\n        <div style=\"background: #ffffff; border: 1px solid #ccd4ea; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-family: 'Cooper Black', 'Cooper Std', Georgia, serif; font-size: 16px; color: #14143c;\">Logo<\/div>\n          <label style=\"display: flex; gap: 10px; align-items: center; font-size: 14px; color: #14143c; cursor: pointer; font-weight: bold;\">\n            <input type=\"checkbox\" checked=\"{{ dLogoOn }}\" onChange=\"{{ onLogoToggle }}\" style=\"width: 18px; height: 18px; accent-color: #14143c; cursor: pointer;\">\n            Show logo at the bottom of every slide\n          <\/label>\n          <div style=\"display: flex; gap: 10px; align-items: center;\">\n            <button onClick=\"{{ onLogoUpload }}\" style=\"background: rgba(255,255,255,0.6); border: 1px solid #98a1c6; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer; color: #14143c;\">Upload logo&hellip;<\/button>\n            <span style=\"font-size: 13px; color: #5b6390;\">{{ logoStatus }}<\/span>\n          <\/div>\n          <input type=\"file\" accept=\"image/*\" ref=\"{{ logoRef }}\" onChange=\"{{ onLogoFile }}\" style=\"display: none;\">\n        <\/div>\n\n        <button onClick=\"{{ onResetDesign }}\" style=\"background: none; border: none; color: #b23a2e; font-size: 13px; cursor: pointer; text-decoration: underline; align-self: center;\">Reset to original style<\/button>\n      <\/div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 16px; position: sticky; top: 96px;\">\n        <div style=\"{{ prevTitleSlideStyle }}\">\n          <div style=\"{{ prevTitleTextStyle }}\">Sing Glory<\/div>\n          <sc-if value=\"{{ dLogoOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ prevLogoStyle }}\"><\/div>\n          <\/sc-if>\n        <\/div>\n        <div style=\"{{ prevLyricSlideStyle }}\">\n          <div style=\"{{ prevLyricTextStyle }}\">The LORD our GOD is a strong defense, A rock in a thirsty land; His truth has stood thru eternal years, And still like His throne shall stand.<\/div>\n          <sc-if value=\"{{ dLogoOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ prevLogoStyle }}\"><\/div>\n          <\/sc-if>\n        <\/div>\n        <div style=\"font-size: 13px; color: #5b6390; line-height: 1.5;\">Preview approximates the exported PowerPoint. Exact fonts depend on what&rsquo;s installed on the computer that opens the file. These settings also apply to the slideshow.<\/div>\n      <\/div>\n    <\/main>\n  <\/sc-if>\n\n  <!-- SLIDESHOW -->\n  <sc-if value=\"{{ showOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Slideshow\" onClick=\"{{ showNext }}\" style=\"{{ showBgStyle }}\">\n      <sc-if value=\"{{ showIsTitle }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ showTitleStyle }}\">{{ showText }}<\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ showIsLyric }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ showLyricStyle }}\">{{ showText }}<\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ dLogoOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ showLogoStyle }}\"><\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ showIsEnd }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; bottom: 3vh; right: 3vw; font-family: Candara, Optima, 'Segoe UI', sans-serif; font-style: italic; font-size: 1.5vw; color: #404040;\">End<\/div>\n      <\/sc-if>\n      <div onClick=\"{{ stopClick }}\" style=\"position: absolute; bottom: 3vh; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: rgba(20,20,60,0.9); color: #ffffff; border-radius: 999px; padding: 8px 14px; font-size: 14px;\">\n        <button onClick=\"{{ showPrev }}\" style=\"background: none; border: none; color: #ffffff; font-size: 16px; cursor: pointer; padding: 4px 8px;\">&#9664;<\/button>\n        <span style=\"min-width: 90px; text-align: center;\">{{ showCounter }}<\/span>\n        <button onClick=\"{{ showNextBtn }}\" style=\"background: none; border: none; color: #ffffff; font-size: 16px; cursor: pointer; padding: 4px 8px;\">&#9654;<\/button>\n        <span style=\"opacity: 0.6; font-size: 12px;\">{{ showSongTitle }}<\/span>\n        <button onClick=\"{{ showExit }}\" style=\"background: none; border: none; color: #ffffff; font-size: 13px; cursor: pointer; padding: 4px 8px; text-decoration: underline;\">Exit (Esc)<\/button>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <!-- LYRICS VIEW -->\n  <sc-if value=\"{{ lyricsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Lyrics view\" style=\"position: fixed; inset: 0; z-index: 70; background: #e9edf8; overflow-y: auto; display: flex; flex-direction: column;\">\n      <div style=\"position: sticky; top: 0; z-index: 2; background: #ffffff; border-bottom: 2px solid #2a2ab8; box-shadow: 0 2px 10px rgba(20,20,60,0.18); padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;\">\n        <div style=\"font-family: 'Cooper Black', 'Cooper Std', Georgia, serif; font-size: 19px; color: #14143c; flex: 1 1 120px; min-width: 0;\">{{ lyricsHeading }}<\/div>\n        <div style=\"display: flex; gap: 0; flex-shrink: 0; white-space: nowrap; border: 1px solid #98a1c6; border-radius: 6px; overflow: hidden;\">\n          <button onClick=\"{{ onLyricsSmaller }}\" title=\"Smaller text\" style=\"padding: 8px 12px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; background: rgba(255,255,255,0.55); color: #3b4272;\">A&minus;<\/button>\n          <button onClick=\"{{ onLyricsLarger }}\" title=\"Larger text\" style=\"padding: 8px 12px; font-size: 16px; font-weight: bold; border: none; border-left: 1px solid #98a1c6; cursor: pointer; background: rgba(255,255,255,0.55); color: #3b4272;\">A+<\/button>\n        <\/div>\n        <button onClick=\"{{ onLyricsLabels }}\" style=\"white-space: nowrap; flex-shrink: 0; {{ lyricsLabelsStyle }}\">Section labels<\/button>\n        <button onClick=\"{{ onLyricsPrint }}\" style=\"white-space: nowrap; flex-shrink: 0; background: #14143c; color: #ffffff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 14px; font-weight: bold; cursor: pointer;\" style-hover=\"background: #1f1f92;\">Print / PDF<\/button>\n        <button onClick=\"{{ onLyricsDoc }}\" style=\"white-space: nowrap; flex-shrink: 0; background: #2a2ab8; color: #ffffff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 14px; font-weight: bold; cursor: pointer;\" style-hover=\"background: #1f1f92;\">&#11015; Word<\/button>\n        <button onClick=\"{{ onLyricsTxt }}\" style=\"white-space: nowrap; flex-shrink: 0; background: rgba(255,255,255,0.6); color: #14143c; border: 1px solid #98a1c6; border-radius: 6px; padding: 9px 14px; font-size: 14px; font-weight: bold; cursor: pointer;\" style-hover=\"background: #e8ebfb;\">&#11015; Text<\/button>\n        <button onClick=\"{{ onLyricsClose }}\" title=\"Close (Esc)\" style=\"white-space: nowrap; flex-shrink: 0; width: 36px; height: 36px; border: 1px solid #dbe1f3; background: #fff; border-radius: 6px; cursor: pointer; font-size: 16px; color: #5b6390;\">&#10005;<\/button>\n      <\/div>\n      <div style=\"padding: 28px 20px 80px; display: flex; justify-content: center;\">\n        <div style=\"background: #ffffff; border: 1px solid #ccd4ea; border-radius: 10px; box-shadow: 0 2px 10px rgba(20,20,60,0.12); max-width: 760px; width: 100%; box-sizing: border-box; padding: 40px 48px 56px; display: flex; flex-direction: column; gap: 44px;\">\n          <sc-for list=\"{{ lyricsSongs }}\" as=\"song\" hint-placeholder-count=\"1\">\n            <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n              <div style=\"display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid #2a2ab8; padding-bottom: 8px;\">\n                <span style=\"font-family: 'Cooper Black', 'Cooper Std', Georgia, serif; font-size: 18px; color: #5b6390;\">{{ song.num }}<\/span>\n                <span style=\"font-family: 'Cooper Black', 'Cooper Std', Georgia, serif; font-size: 26px; color: #14143c; line-height: 1.2; text-wrap: pretty;\">{{ song.title }}<\/span>\n              <\/div>\n              <sc-for list=\"{{ song.sections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <sc-if value=\"{{ sec.showLabel }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-size: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #5b6390;\">{{ sec.label }}<\/div>\n                  <\/sc-if>\n                  <div style=\"{{ lyricsTextStyle }}\">{{ sec.text }}<\/div>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <!-- SONG DETAIL MODAL -->\n  <sc-if value=\"{{ detailOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Song detail\" style=\"position: fixed; inset: 0; background: rgba(16,16,48,0.55); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto;\" onClick=\"{{ onCloseDetail }}\">\n      <div style=\"background: #ffffff; border-radius: 12px; max-width: 760px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; margin-bottom: 40px;\" onClick=\"{{ stopClick }}\">\n        <div style=\"padding: 20px 24px 14px; border-bottom: 1px solid #dbe1f3; display: flex; align-items: center; gap: 14px;\">\n          <input value=\"{{ detailTitle }}\" onChange=\"{{ onTitleChange }}\" style=\"flex: 1; font-family: 'Cooper Black', 'Cooper Std', Georgia, serif; font-size: 24px; color: #14143c; text-shadow: 1px 1px 2px rgba(0,0,0,0.25); background: none; border: none; border-bottom: 1px dashed transparent; outline: none; padding: 2px 0;\" style-focus=\"border-bottom-color: #c3cbe6;\">\n          <button onClick=\"{{ onPresentSong }}\" style=\"background: #14143c; color: #ffffff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 14px; font-weight: bold; cursor: pointer;\" style-hover=\"background: #1f1f92;\">&#9654; Present<\/button>\n          <button onClick=\"{{ onLyricsSong }}\" style=\"background: rgba(255,255,255,0.6); color: #14143c; border: 1px solid #98a1c6; border-radius: 6px; padding: 9px 14px; font-size: 14px; font-weight: bold; cursor: pointer;\" style-hover=\"background: #e8ebfb;\">&#9776; Lyrics<\/button>\n          <button onClick=\"{{ onAddDetailToSetlist }}\" style=\"{{ detailAddStyle }}\">{{ detailAddLabel }}<\/button>\n          <button onClick=\"{{ onCloseDetail }}\" style=\"width: 36px; height: 36px; border: 1px solid #dbe1f3; background: #fff; border-radius: 6px; cursor: pointer; font-size: 16px; color: #5b6390;\">&#10005;<\/button>\n        <\/div>\n        <div style=\"padding: 18px 24px; display: flex; flex-direction: column; gap: 14px;\">\n          <sc-for list=\"{{ detailSections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 12px; align-items: stretch;\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px; width: 130px; flex-shrink: 0;\">\n                <input value=\"{{ sec.label }}\" onChange=\"{{ sec.onLabelChange }}\" style=\"padding: 7px 10px; font-size: 13px; font-weight: bold; border: 1px solid #ccd4ea; border-radius: 6px; background: rgba(255,255,255,0.6); color: #14143c; outline: none;\">\n                <div style=\"font-size: 11px; color: #5b6390; text-align: center;\">slide {{ sec.slideNo }}<\/div>\n                <button onClick=\"{{ sec.onRemove }}\" style=\"background: none; border: none; color: #b23a2e; font-size: 12px; cursor: pointer; text-decoration: underline;\">remove<\/button>\n              <\/div>\n              <textarea value=\"{{ sec.text }}\" onChange=\"{{ sec.onTextChange }}\" rows=\"{{ sec.rows }}\" style=\"flex: 1; resize: vertical; padding: 14px 16px; font-family: Candara, Optima, 'Segoe UI', sans-serif; font-weight: bold; font-size: 16px; line-height: 1.45; color: #1b1b40; background: #ffffff; border: 1px solid #ccd4ea; border-radius: 8px; outline: none; text-align: center;\"><\/textarea>\n            <\/div>\n          <\/sc-for>\n          <div style=\"display: flex; gap: 12px; align-items: center; padding-top: 4px;\">\n            <button onClick=\"{{ onAddSection }}\" style=\"background: rgba(255,255,255,0.55); border: 1px solid #98a1c6; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; color: #14143c; font-weight: bold;\" style-hover=\"background: #ffffff;\">+ Add slide<\/button>\n            <div style=\"flex: 1;\"><\/div>\n            <button onClick=\"{{ onDeleteSong }}\" style=\"background: none; border: none; color: #b23a2e; font-size: 13px; cursor: pointer; text-decoration: underline;\">Delete song from library<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n<\/div>\n<\/x-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;exportAspect&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;4:3&quot;, &quot;16:9&quot;], &quot;default&quot;: &quot;16:9&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;PowerPoint export&quot; },\n  &quot;endMarker&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;PowerPoint export&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'library',\n    query: '',\n    songs: [],\n    loaded: false,\n    setlist: [],\n    setlistName: 'Sunday Worship Program',\n    selectedId: null,\n    design: null,\n    show: null,\n    showIndex: 0,\n    toast: '',\n    exporting: false,\n    importing: false,\n    lyrics: null,\n  };\n\n  lyricsPrefs() {\n    let p = null;\n    try { p = JSON.parse(localStorage.getItem('gbc-lyricsview-v1')); } catch (e) {}\n    return Object.assign({ size: 18, labels: true }, p || {});\n  }\n\n  setLyricsPrefs(patch) {\n    localStorage.setItem('gbc-lyricsview-v1', JSON.stringify(Object.assign(this.lyricsPrefs(), patch)));\n    this.forceUpdate();\n  }\n\n  openLyrics(ids) {\n    if (!ids.length) return;\n    if (!this._lyrKeys) {\n      this._lyrKeys = true;\n      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.state.lyrics && !this.state.show) this.setState({ lyrics: null }); });\n    }\n    this.setState({ lyrics: ids, selectedId: null });\n  }\n\n  lyricsChosen() {\n    return (this.state.lyrics || []).map((id) => this.state.songs.find((x) => x.id === id)).filter(Boolean);\n  }\n\n  lyricsFileName() {\n    const c = this.lyricsChosen();\n    const n = c.length === 1 ? c[0].title : (this.state.setlistName || 'Worship Program') + ' - Lyrics';\n    return n.replace(/[\\\\/:*?\"<>|]/g, '');\n  }\n\n  lyricsHtml(forPrint) {\n    const esc = (t) => String(t || '').replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n    const p = this.lyricsPrefs();\n    const chosen = this.lyricsChosen();\n    const multi = chosen.length > 1;\n    const body = chosen.map((song, i) =>\n      '<div class=\"song\"><h2>' + (multi ? (i + 1) + '. ' : '') + esc(song.title) + '<\/h2>' +\n      song.sections.map((sec) => (p.labels && sec.label ? '<div class=\"lbl\">' + esc(sec.label) + '<\/div>' : '') +\n        '<p>' + esc(sec.text).replace(/\\n/g, '<br>') + '<\/p>').join('') + '<\/div>'\n    ).join('');\n    const head = multi ? '<h1>' + esc(this.state.setlistName || 'Worship Program') + '<\/h1>' : '';\n    return '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>' + esc(this.lyricsFileName()) + '<\/title><style>' +\n      'body{font-family:Candara,Optima,\"Segoe UI\",sans-serif;color:#1b1b40;margin:' + (forPrint ? '0' : '24px') + ';}' +\n      '@page{margin:18mm;}' +\n      'h1{font-family:\"Cooper Black\",Georgia,serif;font-size:22pt;color:#14143c;margin:0 0 18pt;}' +\n      'h2{font-family:\"Cooper Black\",Georgia,serif;font-size:17pt;color:#14143c;border-bottom:2px solid #2a2ab8;padding-bottom:4pt;margin:0 0 10pt;}' +\n      '.song{margin-bottom:26pt;break-inside:avoid-page;}' +\n      '.lbl{font-size:9pt;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#5b6390;margin:0 0 2pt;}' +\n      'p{font-size:' + Math.round(p.size * 0.72) + 'pt;line-height:1.45;margin:0 0 10pt;}' +\n      '<\/style><\/head><body>' + head + body + '<\/body><\/html>';\n  }\n\n  exportLyrics(kind) {\n    const chosen = this.lyricsChosen();\n    if (!chosen.length) return;\n    const download = (blob, ext) => {\n      const a = document.createElement('a');\n      a.href = URL.createObjectURL(blob);\n      a.download = this.lyricsFileName() + ext;\n      a.click();\n      setTimeout(() => URL.revokeObjectURL(a.href), 10000);\n    };\n    if (kind === 'print') {\n      const w = window.open('', '_blank');\n      if (!w) { this.showToast('Allow pop-ups to print or save as PDF.'); return; }\n      w.document.write(this.lyricsHtml(true));\n      w.document.close();\n      w.focus();\n      setTimeout(() => w.print(), 300);\n    } else if (kind === 'doc') {\n      download(new Blob(['\\ufeff' + this.lyricsHtml(false)], { type: 'application/msword' }), '.doc');\n      this.showToast('Word document downloaded.');\n    } else {\n      const p = this
